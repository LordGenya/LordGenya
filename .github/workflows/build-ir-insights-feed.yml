name: Build IR Insights migration feed

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r ir-insights/requirements.txt
      - name: Build feed
        run: python ir-insights/build_feed.py
      - name: Commit generated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ir-insights/feed.xml ir-insights/inventory.csv ir-insights/build_report.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build IR Insights migration feed"
            git push
          fi
